---
k3s_cluster:
  children:
    server:
      hosts:
        192.16.35.11:
    agent:
      hosts:
        192.16.35.12:
        192.16.35.13:

  vars:
    ansible_port: 22
    ansible_user: debian
    k3s_version: v1.36.6+k3s1
    # Generate with "openssl rand -base64 64", and keep it in ansible-vault.
    token: "changeme!"
    api_endpoint: "{{ hostvars[groups['server'][0]]['ansible_host'] | default(groups['server'][0]) }}"

    # Calico. The server config is required, and can't be changed on a running cluster.
    addon_calico_enabled: true
    # addon_calico_version: v3.33.0
    # addon_calico_encapsulation: VXLAN
    # Longhorn. Installs iSCSI and NFS client packages on every node.
    # addon_longhorn_enabled: true
    # addon_longhorn_version: 1.13.0

    # Argo CD. Both files are read from the control node, so they can live in your GitOps repo.
    # addon_argocd_enabled: true
    # addon_argocd_version: 10.11.6
    # addon_argocd_values_file: /path/to/argocd/values.yaml
    # addon_argocd_root_app_file: /path/to/root-application.yaml

    server_config_yaml: |
      flannel-backend: none
      disable-network-policy: true
      cluster-cidr: 10.42.0.0/16
