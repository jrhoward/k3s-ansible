---
- name: Setup K3s
  ansible.builtin.import_playbook: site.yml

- name: Install add-ons
  ansible.builtin.import_playbook: addons.yml

# site.yml leaves this behind with mode 0644, and it holds the admin key.
- name: Remove the leftover kubeconfig from the control node
  hosts: server[0]
  gather_facts: false
  become: false
  tasks:
    - name: Remove ~/.kube/config.new
      when: kubeconfig is not defined
      delegate_to: 127.0.0.1
      tags: kubeconfig
      ansible.builtin.file:
        path: ~/.kube/config.new
        state: absent
